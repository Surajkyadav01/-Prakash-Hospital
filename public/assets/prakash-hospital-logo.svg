<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <style>
      .red-stroke { stroke: #D3222A; fill: none; }
      .blue-stroke { stroke: #15376E; fill: none; }
      .prakash-font {
        font-family: 'Liberation Sans', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 55px;
        letter-spacing: 1px;
        fill: #066735;
      }
      .hospital-font {
        font-family: 'Liberation Sans', Arial, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 25px;
        letter-spacing: 7px;
        fill: #15376E;
      }
    </style>
  </defs>

  <!-- Clean Circular Background -->
  <circle cx="300" cy="300" r="296" fill="#ffffff" />

  <!-- Outermost Red Circular Ring -->
  <circle cx="300" cy="300" r="276" stroke="#D3222A" stroke-width="16" fill="none" />

  <!-- Inner Navy Blue Circular Ring -->
  <circle cx="300" cy="300" r="253" stroke="#15376E" stroke-width="12" fill="none" />

  <!-- Central Medical Cross -->
  <!-- Top Arm (Red) -->
  <rect x="267" y="210" width="46" height="44" fill="#D3222A" rx="2" />
  <!-- Left Arm (Red) -->
  <rect x="218" y="260" width="49" height="44" fill="#D3222A" rx="2" />
  <!-- Center square (divided red & green) -->
  <polygon points="267,254 313,254 267,300" fill="#D3222A" />
  <polygon points="313,254 313,304 267,304" fill="#066735" />
  <!-- Right Arm (Green) -->
  <rect x="313" y="260" width="49" height="44" fill="#066735" rx="2" />
  <!-- Bottom Arm (Green) -->
  <rect x="267" y="304" width="46" height="46" fill="#066735" rx="2" />

  <!-- Stethoscope Wire (Black looping curve) -->
  <path d="M 166 314 C 160 324, 185 330, 215 320 C 275 292, 305 210, 275 145 C 285 112, 315 94, 342 102 C 382 114, 404 165, 388 220 C 375 264, 340 280, 350 296"
        fill="none" stroke="#1A1D20" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stethoscope Chest Piece / Ear Piece Head -->
  <circle cx="354" cy="298" r="28" fill="#ffffff" stroke="#D3222A" stroke-width="7.5" />
  <circle cx="354" cy="298" r="14" fill="#066735" />

  <!-- Dynamic Joyous / Recovered Human Figure (on the right) -->
  <!-- Figure Head (Green) -->
  <circle cx="460" cy="346" r="15.5" fill="#066735" />
  <!-- Figure Arm & Torso Arc (Green) -->
  <path d="M 384 322 C 424 322, 452 356, 448 400 C 442 362, 420 336, 384 322 Z" fill="#066735" />
  <!-- Figure Right Body / Leg Ribbon (Red) -->
  <path d="M 504 306 C 490 366, 460 432, 432 478 C 446 426, 476 364, 504 306 Z" fill="#D3222A" />

  <!-- Hospital Brand Identity Typography (Lower Half) -->
  <g id="brand-group" transform="translate(96, 408)">
    <!-- Winged Red P Monogram -->
    <g id="winged-p" transform="translate(0, 0)">
      <!-- P Letterform -->
      <path d="M 26 2 h 21 c 11 0, 18 6, 18 15 c 0 10, -7 15, -18 15 h -12 v 14 h -9 z M 35 11 v 13 h 12 c 5 0, 9 -2, 9 -6.5 c 0 -4.5, -4 -6.5, -9 -6.5 z" fill="#D3222A" />
      <!-- Speed Wings Extending Left -->
      <rect x="0" y="2" width="21" height="5.5" rx="2.75" fill="#D3222A" />
      <rect x="6" y="12" width="15" height="5.5" rx="2.75" fill="#D3222A" />
      <rect x="13" y="22" width="8" height="5.5" rx="2.75" fill="#D3222A" />
    </g>

    <!-- PRAKASH in Bold Green -->
    <text x="68" y="42" class="prakash-font">PRAKASH</text>

    <!-- HOSPITAL in Bold Navy Blue below -->
    <text x="96" y="76" class="hospital-font">HOSPITAL</text>
  </g>
</svg>