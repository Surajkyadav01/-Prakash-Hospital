<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Filter for realistic architectural sign shadow -->
    <filter id="buildingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Signboard gradient -->
    <linearGradient id="signBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36" />
      <stop offset="50%" stop-color="#0d254c" />
      <stop offset="100%" stop-color="#07152b" />
    </linearGradient>

    <!-- Signboard border shine -->
    <linearGradient id="metalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="35%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Red Cross emblem gradient -->
    <linearGradient id="crossRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- 1. Real Modern Hospital Building Base Photo -->
  <image href="/tmp/resized.jpg" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" />

  <!-- 2. Subtle architectural depth tint on hospital building -->
  <rect width="1920" height="1080" fill="#0f172a" opacity="0.12" />

  <!-- 3. Prominent Architectural Prakash Hospital Facade Signboard -->
  <!-- Positioned centrally / upper building facade -->
  <g transform="translate(680, 70)" filter="url(#buildingShadow)">
    
    <!-- Outer Mounting Frame with brushed metallic finish -->
    <rect x="-10" y="-10" width="760" height="230" rx="16" fill="url(#metalBorder)" opacity="0.9" />
    <rect x="-6" y="-6" width="752" height="222" rx="13" fill="#030712" />
    
    <!-- Main Sign Plaque -->
    <rect x="0" y="0" width="740" height="210" rx="10" fill="url(#signBg)" />

    <!-- Subtle inner glass reflection highlight -->
    <path d="M 0,0 L 740,0 L 520,70 L 0,70 Z" fill="#ffffff" opacity="0.06" />

    <!-- Corner mounting chrome bolts -->
    <circle cx="20" cy="20" r="4.5" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
    <circle cx="720" cy="20" r="4.5" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="190" r="4.5" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />
    <circle cx="720" cy="190" r="4.5" fill="#94a3b8" stroke="#334155" stroke-width="1.5" />

    <!-- Medical Cross Emblem on Left with glowing badge -->
    <g transform="translate(42, 38)">
      <!-- White circular shield -->
      <circle cx="55" cy="55" r="50" fill="#ffffff" filter="url(#softGlow)" />
      <circle cx="55" cy="55" r="46" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      
      <!-- Red Cross Symbol -->
      <path d="M 43,26 L 67,26 L 67,43 L 84,43 L 84,67 L 67,67 L 67,84 L 43,84 L 43,67 L 26,67 L 26,43 L 43,43 Z" fill="url(#crossRed)" />
      
      <!-- Center subtle pulse dot -->
      <circle cx="55" cy="55" r="3" fill="#ffffff" />
    </g>

    <!-- Typography: English Brand Name -->
    <g transform="translate(175, 42)">
      <text x="0" y="38" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">PRAKASH HOSPITAL</text>
      
      <!-- Hindi Brand Name: प्रकाश हॉस्पिटल -->
      <text x="2" y="80" font-family="'Lohit Devanagari', 'Gargi', 'Noto Sans Devanagari', 'Samyak Devanagari', sans-serif" font-size="34" font-weight="bold" fill="#38bdf8" letter-spacing="1">प्रकाश हॉस्पिटल</text>
      
      <!-- Tagline & Speciality -->
      <text x="2" y="112" font-family="'DejaVu Sans', 'Liberation Sans', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">Multi-Speciality Healthcare &amp; Trauma Centre • Suriyawan</text>
      
      <!-- Trust Chips on signboard -->
      <g transform="translate(0, 126)">
        <rect x="0" y="0" width="135" height="24" rx="4" fill="#0369a1" opacity="0.8" />
        <text x="67" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">24x7 EMERGENCY</text>

        <rect x="145" y="0" width="125" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="207" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">ICU &amp; MODERN OT</text>

        <rect x="280" y="0" width="120" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="340" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0" text-anchor="middle">DIGITAL X-RAY</text>
      </g>
    </g>

    <!-- Top edge illumination LED bar effect -->
    <rect x="20" y="4" width="700" height="2.5" fill="#38bdf8" opacity="0.75" />
  </g>

  <!-- 4. Subtle ambulance / emergency canopy indicator in lower right -->
  <g transform="translate(1420, 680)">
    <rect x="0" y="0" width="380" height="75" rx="8" fill="#dc2626" opacity="0.9" filter="url(#buildingShadow)" />
    <text x="190" y="34" font-family="'DejaVu Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">EMERGENCY &amp; AMBULANCE</text>
    <text x="190" y="58" font-family="'DejaVu Sans', sans-serif" font-size="14" font-weight="700" fill="#fef2f2" text-anchor="middle">24 HOURS OPEN • +91 94505 32777</text>
  </g>
</svg>
